# Drop 001. Starter list, edit or replace it with your own picks.
#
# kind:         forgotten (was popular once, nobody plays it now)
#               obscure   (never surfaced in the first place)
# duration:     M:SS, or null if you have not checked yet
# submitted_by: a handle from submissions/, or "curator"
# links:        optional. With none, the site links to a search instead.

date: 2026-08-26
number: 1
title: Drop 001
blurb: >
  Seven records that fell through the floor. Two were hits somewhere once,
  the rest never got the chance.

tracks:
  - artist: Connie Converse
    title: Talkin' Like You (Two Tall Mountains)
    year: 1954
    duration: null
    kind: obscure
    submitted_by: curator
    why: >
      Recorded on a home tape machine in Greenwich Village years before anyone
      was calling this singer-songwriter music. She never got a record out, quit,
      and in 1974 packed a car and drove off. Nobody has seen her since.

  - artist: Sibylle Baier
    title: Tonight
    year: 1971
    duration: null
    kind: obscure
    submitted_by: curator
    why: >
      Made at home in Germany in the early seventies and then put in a drawer.
      Her son found the tapes decades later and pressed them. Listen to how
      close the microphone is.

  - artist: Lewis
    title: I Thought The World Of You
    year: 1983
    duration: null
    kind: obscure
    submitted_by: curator
    why: >
      A private press record so faint it barely registers as sound. For years
      nobody knew who made it or whether he was still alive. Play it louder than
      feels right.

  - artist: Bobb Trimble
    title: Killed By The Hands Of An Unknown Rock Star
    year: 1982
    duration: null
    kind: obscure
    submitted_by: curator
    why: >
      Massachusetts, self-financed, a few hundred copies. It sounds like it was
      recorded inside a different decade than the one it came out in.

  - artist: Mort Garson
    title: Plantasia
    year: 1976
    duration: null
    kind: forgotten
    submitted_by: curator
    why: >
      Moog music written for houseplants and given away with a purchase at a
      Los Angeles plant store. It sat forgotten for forty years before anyone
      reissued it.

  - artist: Dorothy Ashby
    title: Soul Vibrations
    year: 1968
    duration: null
    kind: forgotten
    submitted_by: curator
    why: >
      Jazz harp, which should not work and completely does. Sampled to death by
      producers who never credited where it came from.

  - artist: The Shaggs
    title: My Pal Foot Foot
    year: 1969
    duration: null
    kind: obscure
    submitted_by: curator
    why: >
      Three sisters whose father was certain they were destined for this. The
      drums and the guitars are in different rooms of the same house. Stay with
      it past the first minute, it starts to make its own kind of sense.
