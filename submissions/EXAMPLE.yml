# submissions/ is not a sign-up sheet. There is one file here, the maintainer's,
# and it names the playlist the site falls back on when submitted picks do not
# fill a week.
#
# To take part, send in a single track:
#   https://shanebivens.github.io/CrateDig/submit.html
#
# The shape of the file, for reference:

handle: example-handle
joined: 2026-08-26
bio: One line about what you tend to dig for.

# Only a file marked this way is ever read by scripts/pull_playlist.py. Without
# it a playlist listed here is left completely alone.
pool: false

playlists:
  - url: https://music.youtube.com/playlist?list=PLxxxxxxxxxxxxxxxxxxxxxxxx
    service: youtube-music
    note: What this playlist is.
