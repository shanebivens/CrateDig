name: Send in a track
description: One track almost nobody has heard, or nobody has played in years.
title: "[pick] Artist - Title"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Public links only. No account access, no credentials, ever.
        Submitting means you agree to [CLA.md](https://github.com/shanebivens/CrateDig/blob/main/CLA.md).

  - type: input
    id: link
    attributes:
      label: A link to the track
      description: >
        YouTube, Spotify, Bandcamp, SoundCloud, Apple Music, Tidal, Discogs or
        Archive.org. A YouTube link becomes the doorway people press. Bandcamp
        is better when the artist sells it directly.
      placeholder: https://
    validations:
      required: true

  - type: input
    id: artist
    attributes:
      label: Artist
      description: Leave it blank and it gets read from the link.
      placeholder: Connie Converse

  - type: input
    id: track
    attributes:
      label: Track or album
      description: Leave it blank and it gets read from the link.
      placeholder: Talkin' Like You (Two Tall Mountains)

  - type: input
    id: year
    attributes:
      label: Year
      description: Recording or release year, whichever tells the better story.
      placeholder: "1954"

  - type: dropdown
    id: kind
    attributes:
      label: Which kind of find is this
      options:
        - obscure
        - forgotten
        - sideways
      default: 0
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why this one
      description: >
        Optional. What is the story, why did it disappear, what should someone
        listen for. Two sentences beats two paragraphs. Leave it blank and the
        track still goes out, with a writeup added before it does.

  - type: checkboxes
    id: stake
    attributes:
      label: Disclosure
      options:
        - label: I have a stake in this record (my band, my label, a friend's record). Saying so is allowed and encouraged.
