name: Submit a track
description: A record almost nobody has heard, or nobody has played in years.
title: "[pick] Artist - Title"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Public links only. No account access, no credentials, ever.
        Submitting means you agree to [CLA.md](https://github.com/shanebivens/CrateDig/blob/main/CLA.md).

  - type: input
    id: artist
    attributes:
      label: Artist
      placeholder: Connie Converse
    validations:
      required: true

  - type: input
    id: track
    attributes:
      label: Track or album
      placeholder: Talkin' Like You (Two Tall Mountains)
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: Year
      description: Recording or release year, whichever tells the better story.
      placeholder: "1954"

  - type: dropdown
    id: kind
    attributes:
      label: Which kind of find is this
      options:
        - obscure
        - forgotten
      default: 0
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why this one
      description: What is the story, why did it disappear, what should someone listen for. Two sentences beats two paragraphs.
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: A public link
      description: Bandcamp if the artist sells it directly, otherwise whatever works. Leave it blank and the site links to a search instead.
      placeholder: https://

  - type: checkboxes
    id: stake
    attributes:
      label: Disclosure
      options:
        - label: I have a stake in this record (my band, my label, a friend's record). Saying so is allowed and encouraged.
