name: Intake

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: write
  issues: write

# One group per issue: GitHub keeps only a single queued run per group, so a
# burst of submissions in one shared group cancels its own backlog.
concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  file-it:
    if: >-
      contains(github.event.issue.labels.*.name, 'submission') ||
      contains(github.event.issue.body, '### A link to the track')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Read the issue into the repository
        id: intake
        continue-on-error: true
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          TODAY: ${{ github.event.issue.created_at }}
        run: |
          export TODAY="${TODAY%%T*}"
          python scripts/intake.py --type track

      - name: Rebuild site data
        if: steps.intake.outcome == 'success'
        run: python scripts/build.py

      - name: Commit
        if: steps.intake.outcome == 'success'
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all inbox data)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox data
          git commit -m "Intake from #${{ github.event.issue.number }}"
          git pull --rebase --autostash origin main
          git push

      - name: Reply on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body-file .intake-comment.md

      - name: Close it out
        if: steps.intake.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the label if it is missing, otherwise --add-label fails and
          # the issue never gets closed.
          gh label create filed --repo "${{ github.repository }}" \
            --description "Read into the repository" --color 0e8a16 2>/dev/null || true
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" --add-label filed
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}"

      - name: Fail the run if the submission could not be used
        if: steps.intake.outcome != 'success'
        run: exit 1
