name: Daily drop

on:
  schedule:
    # 12:00 UTC. Change this line to move what time the drop lands.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Which day to build, YYYY-MM-DD. Blank means today."
        required: false
      count:
        description: "How many tracks to pull."
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: daily-drop
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Refresh the pool from participants' public playlists
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/pull_playlist.py

      - name: Build today's drop
        run: |
          DAY="${{ github.event.inputs.date }}"
          if [ -z "$DAY" ]; then DAY="$(date -u +%F)"; fi
          COUNT="${{ github.event.inputs.count }}"
          if [ -z "$COUNT" ]; then COUNT=2; fi
          python scripts/make_drop.py --date "$DAY" --count "$COUNT"

      - name: Rebuild site data
        run: python scripts/build.py

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all drops data)" ]; then
            echo "Nothing new today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drops data
          git commit -m "Daily drop for $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
