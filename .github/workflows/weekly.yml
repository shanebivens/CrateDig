name: Weekly drop

on:
  schedule:
    # Sunday 12:00 UTC. Change this line to move when the drop lands.
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      date:
        description: "Which day to build, YYYY-MM-DD. Blank means today."
        required: false
      minutes:
        description: "How much runtime to fill."
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: weekly-drop
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Refresh the pool from participants' public playlists
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/pull_playlist.py

      - name: Build the drop
        run: |
          DAY="${{ github.event.inputs.date }}"
          if [ -z "$DAY" ]; then DAY="$(date -u +%F)"; fi
          MINUTES="${{ github.event.inputs.minutes }}"
          if [ -z "$MINUTES" ]; then MINUTES=30; fi
          python scripts/make_drop.py --date "$DAY" --minutes "$MINUTES"

      - name: Rebuild site data
        run: python scripts/build.py

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all drops data)" ]; then
            echo "Nothing new this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drops data
          git commit -m "Weekly drop for $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
