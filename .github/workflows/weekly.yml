name: Monday drop

on:
  schedule:
    # 12:01pm Eastern, both halves of the year. Daylight saving is handled in
    # the script, so an early run publishes nothing and simply waits.
    - cron: "1 16 * * 1"
    - cron: "1 17 * * 1"
  workflow_dispatch:
    inputs:
      weeks:
        description: "How many weeks to keep lined up."
        required: false
        default: "8"

permissions:
  contents: write

concurrency:
  group: monday-drop
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Publish anything whose Monday has come
        run: python scripts/publish_due.py

      - name: Refresh the pool from the playlist marked for it
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/pull_playlist.py

      - name: Look up Spotify links where they can be matched
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python scripts/resolve_spotify.py

      - name: Top the queue back up
        run: |
          WEEKS="${{ github.event.inputs.weeks }}"
          if [ -z "$WEEKS" ]; then WEEKS=8; fi
          python scripts/seed_weeks.py --weeks "$WEEKS" --reserve 2

      - name: Put the newest submissions into the next week
        run: python scripts/place_inbox.py

      - name: Check every track still plays
        run: python scripts/check_links.py

      - name: Rebuild site data
        run: python scripts/build.py

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all drops scheduled data)" ]; then
            echo "Nothing to do this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drops scheduled data
          git commit -m "Monday drop for $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
